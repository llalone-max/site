# Written 2026-08-19 by the Guardrails terminal. This job had no manifest and no registry entry,
# which is the exact blind spot recorded in discover.py's SCAN_ROOTS comment: a machine-level
# launchd job that no Drive scan could ever see.
name: resume-sync
title: "Resume PDF sync to lazarlalone.com"
purpose: "Keep the live site's record PDFs and preview image in step with Lazar LaLone's newest resumes, with no manual copying. Newest *_P.pdf becomes record-healthcare.pdf plus its first-page preview; newest *_M.pdf becomes record-brands.pdf."
status: active
owner: Lazar
root: "~/site-repo"
runtime:
  language: python
  env: "/usr/bin/python3 (system), stdlib plus Pillow, plus pdftoppm from poppler for the preview render"
  keys: "none. It commits and pushes with the machine's existing git credentials for llalone-max/site-repo."
entrypoints:
  - desc: "run it by hand; idempotent, does nothing and exits 0 when no resume changed"
    cmd: "cd ~/site-repo && /usr/bin/python3 resume_sync.py"
  - desc: "load or reload the scheduled job"
    cmd: "launchctl unload ~/Library/LaunchAgents/com.lazarlalone.resume-sync.plist; launchctl load ~/Library/LaunchAgents/com.lazarlalone.resume-sync.plist"
schedule:
  type: launchd
  detail: "com.lazarlalone.resume-sync, StartCalendarInterval 09:00 local, RunAtLoad false. Loaded and reporting last exit 0 as of 2026-08-19 (launchctl list). Logs at ~/Library/Logs/resume-sync.log and .err.log."
dependencies:
  models: []   # file comparison and a PDF page render; no model in this path
  services:
    - kind: local_folder
      id: "~/Desktop/Current Resumes - All Current Versions"
      detail: "The source of truth. Files whose names carry SUPERSEDED, DO NOT SEND or OLD are skipped, case-insensitively."
    - kind: github
      id: "llalone-max/site-repo"
      detail: "Commits only when bytes actually changed, then git pull --rebase (the live cost meter's Action also pushes to main) and git push. Fail-soft: it exits non-zero rather than leaving a half-rebased tree."
docs:
  - "../../resume_sync.py"
notes: >
  The AI lane has no record PDF on purpose, so record-ai.* is never written or touched.
